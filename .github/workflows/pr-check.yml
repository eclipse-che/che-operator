name: PR check
on: pull_request
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Set up Go 1.26.5
      uses: actions/setup-go@v3
      with:
        go-version: 1.26.5
    - name: Run unit tests
      run: make test
  multiplatform-image-build:
    strategy:
      fail-fast: false
      matrix:
        runners: ['ubuntu-24.04', 'ubuntu-24.04-arm']
    runs-on: ${{matrix.runners}}
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Set arch environment variable
      run: |
        if [[ ${{matrix.runners}} == 'ubuntu-24.04' ]]; then
          echo arch="amd64" >> $GITHUB_ENV
        else
          echo arch="arm64" >> $GITHUB_ENV
        fi
    - name: Build image
      run: docker buildx build --platform linux/${{env.arch}} .
  source-code-validation:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Set up Go 1.26.5
      uses: actions/setup-go@v3
      with:
        go-version: 1.26.5
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        install-only: true
    - name: Cache go modules
      id: cache-mod
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Download dependencies
      run: go mod download
      if: steps.cache-mod.outputs.cache-hit != 'true'
    - name: Check go mod status
      run: |
        go mod tidy
        if [[ ! -z $(git status -s) ]]
        then
          echo "Go mod state is not clean:"
          git --no-pager diff
          exit 1
        fi
    - name: Lint with go vet
      run: go vet ./...
    - name: Lint with golangci-lint
      run: golangci-lint run
    - name: Check format
      run: |
        go install golang.org/x/tools/cmd/goimports@latest
        go install github.com/che-incubator/check-license-header@379ba18fdb906d341ae451ea155cc34f1c4b4f1a
        git reset HEAD --hard
        echo "[INFO] Check code format and imports."
        make fmt
        if [[ ! -z $(git status -s) ]]
        then
          echo "not well formatted sources are found."
          echo "execute 'make fmt' to fix the following:"
          git --no-pager diff
          exit 1
        fi

        echo "[INFO] Check license headers."
        FILES_TO_CHECK_LICENSE=$(find . \
        -not -path "./mocks/*" \
        -not -path "./vendor/*" \
        -not -path "./testbin/*" \
        -not -path "./bundle/stable/*" \
        -not -path "./config/manager/controller_manager_config.yaml" \
        \( -name '*.sh' -o -name "*.go" -o -name "*.yaml" -o -name "*.yml" \))
        LICENSE_TEMPLATE="${GITHUB_WORKSPACE}/hack/license-header.txt"
        check-license-header -f "${LICENSE_TEMPLATE}" ${FILES_TO_CHECK_LICENSE}
  dependencies-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if go.mod changed
        id: go-mod-check
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^go\.mod$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "go.mod has not changed, skipping dependencies validation."
          fi
      - name: Check dependencies
        if: steps.go-mod-check.outputs.changed == 'true'
        run: build/scripts/clear-defined-test.sh
  docker-build:
    needs: unit-tests
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    if: ${{ github.base_ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    env:
      IMAGE_VERSION: pr-${{ github.event.pull_request.number }}
      ORGANIZATION: quay.io/eclipse
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64,linux/s390x
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/s390x
          push: true
          provenance: false
          tags: ${{ env.ORGANIZATION }}/che-operator:${{ env.IMAGE_VERSION }}
      - name: Comment with image name
        uses: actions/github-script@v7
        with:
          script: |
            const { issue: { number: issue_number }, repo: { owner, repo } } = context;
            const operatorImage = "${{ env.ORGANIZATION }}/che-operator:${{ env.IMAGE_VERSION }}";
            github.rest.issues.createComment({ issue_number, owner, repo, body: `New operator image available: ${operatorImage}` });
