name: PR check
on: pull_request
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go 1.26.5
      uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3.6.1
      with:
        go-version: 1.26.5
    - name: Run unit tests
      run: make test
  source-code-validation:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout source code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go 1.26.5
      uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3.6.1
      with:
        go-version: 1.26.5
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.12.2
        install-only: true
    - name: Cache go modules
      id: cache-mod
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Download dependencies
      run: go mod download
      if: steps.cache-mod.outputs.cache-hit != 'true'
    - name: Check go mod status
      run: |
        go mod tidy
        if [[ ! -z $(git status -s) ]]
        then
          echo "Go mod state is not clean:"
          git --no-pager diff
          exit 1
        fi
    - name: Lint with go vet
      run: go vet ./...
    - name: Lint with golangci-lint
      run: golangci-lint run
    - name: Check format
      run: |
        go install golang.org/x/tools/cmd/goimports@latest
        go install github.com/che-incubator/check-license-header@379ba18fdb906d341ae451ea155cc34f1c4b4f1a
        git reset HEAD --hard
        echo "[INFO] Check code format and imports."
        make fmt
        if [[ ! -z $(git status -s) ]]
        then
          echo "not well formatted sources are found."
          echo "execute 'make fmt' to fix the following:"
          git --no-pager diff
          exit 1
        fi

        echo "[INFO] Check license headers."
        FILES_TO_CHECK_LICENSE=$(find . \
        -not -path "./mocks/*" \
        -not -path "./vendor/*" \
        -not -path "./testbin/*" \
        -not -path "./bundle/stable/*" \
        -not -path "./config/manager/controller_manager_config.yaml" \
        -not -path "./header-rewrite-traefik-plugin" \
        \( -name '*.sh' -o -name "*.go" -o -name "*.yaml" -o -name "*.yml" \))
        LICENSE_TEMPLATE="${GITHUB_WORKSPACE}/hack/license-header.txt"
        check-license-header -f "${LICENSE_TEMPLATE}" ${FILES_TO_CHECK_LICENSE}
  dependencies-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check if go.mod changed
        id: go-mod-check
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^go\.mod$'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "go.mod has not changed, skipping dependencies validation."
          fi
      - name: Check dependencies
        if: steps.go-mod-check.outputs.changed == 'true'
        run: build/scripts/clear-defined-test.sh
