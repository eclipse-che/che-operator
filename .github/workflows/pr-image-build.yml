name: PR Image Build
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  build-operator:
    concurrency:
      group: build-operator
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      OPERATOR_IMAGE: quay.io/eclipse/che-operator:pr-${{ github.event.pull_request.number }}-${{ matrix.arch }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push ${{ matrix.arch }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ env.OPERATOR_IMAGE }}

  build-catalog:
    runs-on: ${{ matrix.runner }}
    needs:
      - build-operator
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      OPERATOR_IMAGE: quay.io/eclipse/che-operator:pr-${{ github.event.pull_request.number }}-${{ matrix.arch }}
      CATALOG_IMAGE: quay.io/eclipse/eclipse-che-olm-catalog:pr-${{ github.event.pull_request.number }}-${{ matrix.arch }}
      BUNDLE_IMAGE: quay.io/eclipse/eclipse-che-olm-bundle:pr-${{ github.event.pull_request.number }}-${{ matrix.arch }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install yq
        run: sudo pip install yq

      - name: Login to quay.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io

      - name: Build catalog source
        run: |
          CSV_PATH=$(make csv-path CHANNEL=next)
          
          yq -riY '.metadata.annotations.containerImage = "'"${OPERATOR_IMAGE}"'"' "${CSV_PATH}"
          yq -riY '.spec.install.spec.deployments[0].spec.template.spec.containers[0].image = "'"${OPERATOR_IMAGE}"'"' "${CSV_PATH}"
          
          ${GITHUB_WORKSPACE}/build/scripts/olm/release-catalog.sh \
            --channel next \
            --image-tool docker \
            --multi-arch \
            --force \
            --arch "linux/${{ matrix.arch }}" \
            --bundle-image "${BUNDLE_IMAGE}" \
            --catalog-image "${CATALOG_IMAGE}"        

  comment:
    runs-on: ubuntu-24.04
    needs:
      - build-catalog
    env:
      BASE_OPERATOR_IMAGE: quay.io/eclipse/che-operator:pr-${{ github.event.pull_request.number }}
      BASE_CATALOG_IMAGE: quay.io/eclipse/eclipse-che-olm-catalog:pr-${{ github.event.pull_request.number }}
    steps:
      - name: Comment with image names
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { issue: { number: issue_number }, repo: { owner, repo } } = context;
            const body = [
              '### 🐳 New operator images available',
              '',
              '- `${{ env.BASE_OPERATOR_IMAGE }}-amd64`',
              '- `${{ env.BASE_OPERATOR_IMAGE }}-arm64`',
              '',
              '### 📦 New catalog images available',
              '',
              '- `${{ env.BASE_CATALOG_IMAGE }}-amd64`',
              '- `${{ env.BASE_CATALOG_IMAGE }}-arm64`',
            ].join('\n');
            await github.rest.issues.createComment({ issue_number, owner, repo, body });
