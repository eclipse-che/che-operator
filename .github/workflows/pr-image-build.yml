name: PR Image Build
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  build-operator-for-amd64:
    runs-on: ubuntu-24.04
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    env:
      OPERATOR_IMAGE: quay.io/eclipse/che-operator:pr-${{ github.event.pull_request.number }}-amd64
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to quay.io
      uses: docker/login-action@v3
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}
    - name: Build and push amd64 image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64
        push: true
        provenance: false
        tags: ${{ env.OPERATOR_IMAGE }}
  build-operator-for-arm64:
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    env:
      OPERATOR_IMAGE: quay.io/eclipse/che-operator:pr-${{ github.event.pull_request.number }}-arm64
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to quay.io
      uses: docker/login-action@v3
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}
    - name: Build and push arm64 image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/arm64
        push: true
        provenance: false
        tags: ${{ env.OPERATOR_IMAGE }}
  build-catalog-for-amd64:
    runs-on: ubuntu-24.04
    needs:
      - build-operator-for-amd64
    env:
      OPERATOR_IMAGE: quay.io/eclipse/che-operator:pr-${{ github.event.pull_request.number }}-amd64
      CATALOG_IMAGE: quay.io/eclipse/eclipse-che-olm-catalog:pr-${{ github.event.pull_request.number }}-amd64
      BUNDLE_IMAGE: quay.io/eclipse/eclipse-che-olm-bundle:pr-${{ github.event.pull_request.number }}-amd64
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install yq
        run: sudo pip install yq
      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io
      - name: Build catalog source
        run: |
          CSV_PATH=$(make csv-path CHANNEL=next)
          
          yq -riY '.metadata.annotations.containerImage = "'"${OPERATOR_IMAGE}"'"' "${CSV_PATH}"
          yq -riY '.spec.install.spec.deployments[0].spec.template.spec.containers[0].image = "'"${OPERATOR_IMAGE}"'"' "${CSV_PATH}"
        
          ${GITHUB_WORKSPACE}/build/scripts/olm/release-catalog.sh \
            --channel next \
            --image-tool docker \
            --multi-arch \
            --force \
            --arch "linux/amd64" \
            --bundle-image "${BUNDLE_IMAGE}" \
            --catalog-image "${CATALOG_IMAGE}"
  build-catalog-for-arm64:
    runs-on: ubuntu-24.04-arm
    needs:
      - build-operator-for-arm64
    env:
      OPERATOR_IMAGE: quay.io/eclipse/che-operator:pr-${{ github.event.pull_request.number }}-arm64
      CATALOG_IMAGE: quay.io/eclipse/eclipse-che-olm-catalog:pr-${{ github.event.pull_request.number }}-arm64
      BUNDLE_IMAGE: quay.io/eclipse/eclipse-che-olm-bundle:pr-${{ github.event.pull_request.number }}-arm64
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install yq
        run: sudo pip install yq
      - name: Login to quay.io
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
          registry: quay.io
      - name: Build catalog source
        run: |
          CSV_PATH=$(make csv-path CHANNEL=next)
          
          yq -riY '.metadata.annotations.containerImage = "'"${OPERATOR_IMAGE}"'"' "${CSV_PATH}"
          yq -riY '.spec.install.spec.deployments[0].spec.template.spec.containers[0].image = "'"${OPERATOR_IMAGE}"'"' "${CSV_PATH}"
          
          ${GITHUB_WORKSPACE}/build/scripts/olm/release-catalog.sh \
            --channel next \
            --image-tool docker \
            --multi-arch \
            --force \
            --arch "linux/arm64" \
            --bundle-image "${BUNDLE_IMAGE}" \
            --catalog-image "${CATALOG_IMAGE}"
  comment:
    runs-on: ubuntu-24.04
    needs:
      - build-catalog-for-amd64
      - build-catalog-for-arm64
    env:
      BASE_OPERATOR_IMAGE: quay.io/eclipse/che-operator:pr-${{ github.event.pull_request.number }}
      BASE_CATALOG_IMAGE: quay.io/eclipse/eclipse-che-olm-catalog:pr-${{ github.event.pull_request.number }}
    steps:
      - name: Comment with image names
        uses: actions/github-script@v7
        with:
          script: |
            const { issue: { number: issue_number }, repo: { owner, repo } } = context;
            const body = [
              '### 🐳 New operator images available',
              '',
              '- `${{ env.BASE_OPERATOR_IMAGE }}-amd64`',
              '- `${{ env.BASE_OPERATOR_IMAGE }}-arm64`',
              '',
              '### 📦 New catalog images available',
              '',
              '- `${{ env.BASE_CATALOG_IMAGE }}-amd64`',
              '- `${{ env.BASE_CATALOG_IMAGE }}-arm64`',
            ].join('\n');
            await github.rest.issues.createComment({ issue_number, owner, repo, body });
