spring:
  application:
    name: openvsx-server
  autoconfigure:
    exclude:
      - org.springframework.boot.zipkin.autoconfigure.ZipkinAutoConfiguration
  profiles:
    include: ovsx
  cache:
    jcache:
      config: classpath:ehcache.xml
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_SERVICE}:${POSTGRESQL_PORT}/${POSTGRESQL_DATABASE}
    username: ${POSTGRESQL_USER}
    password: ${POSTGRESQL_PASSWORD}
  flyway:
    baseline-on-migrate: true
    baseline-version: 0.1.0
    baseline-description: JobRunr tables
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  thymeleaf:
    check-template-location: false

server:
  port: 8080
  servlet:
    context-path: /openvsx
  forward-headers-strategy: none

management:
  health:
    elasticsearch:
      enabled: false
    redis:
      enabled: false
    probes:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health

jobrunr:
  job-scheduler:
    enabled: true
  background-job-server:
    enabled: true
    worker-count: 2
  dashboard:
    enabled: false
  database:
    type: sql
  miscellaneous:
    allow-anonymous-data-usage: false

bucket4j:
  enabled: false

ovsx:
  server:
    url: ${OVSX_SERVER_URL:}
  databasesearch:
    enabled: true
  elasticsearch:
    enabled: false
  redis:
    enabled: false
  integrity:
    key-pair: create
  registry:
    version: 'v1.4.0'
  storage:
    local:
      directory: /openvsx/extensions
