---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: org.eclipse.che
  labels:
    app.kubernetes.io/component: che-operator
    app.kubernetes.io/instance: che
    app.kubernetes.io/name: che
    app.kubernetes.io/part-of: che.eclipse.org
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: che-operator-service
        namespace: eclipse-che
        path: /mutate-org-eclipse-che-v2-checluster
    failurePolicy: Fail
    name: mchecluster.kb.io
    rules:
      - apiGroups:
          - org.eclipse.che
        apiVersions:
          - v2
        operations:
          - CREATE
          - UPDATE
        resources:
          - checlusters
    sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: org.eclipse.che
  labels:
    app.kubernetes.io/component: che-operator
    app.kubernetes.io/instance: che
    app.kubernetes.io/name: che
    app.kubernetes.io/part-of: che.eclipse.org
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: che-operator-service
        namespace: eclipse-che
        path: /validate-org-eclipse-che-v2-checluster
    failurePolicy: Fail
    name: vchecluster.kb.io
    rules:
      - apiGroups:
          - org.eclipse.che
        apiVersions:
          - v2
        operations:
          - CREATE
          - UPDATE
        resources:
          - checlusters
    sideEffects: None
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: che-operator-service
        namespace: eclipse-che
        path: /validate-advanced-authorization
    failurePolicy: Fail
    name: vauthorization.kb.io
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/component: workspaces-namespace
    objectSelector:
      matchLabels:
        app.kubernetes.io/part-of: che.eclipse.org
        app.kubernetes.io/component: advanced-authorization
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - configmaps
    sideEffects: None
